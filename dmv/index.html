<title>CA DMV Practice Test — Demo</title>
<style>
  :root{ --blue:var(--tg-theme-button-color, #2563EB); --blue-dark:#1D4ED8; --ink:var(--tg-theme-text-color, #111827); --muted:var(--tg-theme-hint-color, #6B7280); --bg:var(--tg-theme-secondary-bg-color, #F3F4F6); --card:var(--tg-theme-bg-color, #FFFFFF); --ok:#16A34A; --ok-bg:#DCFCE7; --bad:#DC2626; --bad-bg:#FEE2E2; --line:#E5E7EB; --chip-bg:#EFF6FF; --warn-bg:#FEF3C7; --warn-ink:#92400E; }
  [data-scheme="dark"]{ --blue:#5288F7; --blue-dark:#93C5FD; --ink:#F3F4F6; --muted:#9CA3AF; --bg:#131418; --card:#1E2026; --line:rgba(255,255,255,.16); --ok:#4ADE80; --ok-bg:rgba(22,163,74,.22); --bad:#F87171; --bad-bg:rgba(220,38,38,.22); --chip-bg:rgba(59,130,246,.25); --warn-bg:rgba(245,158,11,.16); --warn-ink:#FCD34D; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Armenian",sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  .wrap{ max-width:680px; margin:0 auto; padding:16px 16px 48px; }
  header.top{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0 16px; }
  .logo{ font-weight:800; font-size:20px; letter-spacing:.2px; }
  .logo span{ color:var(--blue); }
  .demo-badge{ display:inline-block; background:var(--warn-bg); color:var(--warn-ink); font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; vertical-align:middle; margin-left:8px; text-transform:uppercase; letter-spacing:.6px; }
  .langs{ display:flex; gap:6px; }
  .langs button{ border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 12px; border-radius:999px; font-size:14px; cursor:pointer; }
  .langs button.active{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px 20px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  h1{ font-size:26px; line-height:1.25; margin-bottom:8px; }
  .sub{ color:var(--muted); font-size:15px; margin-bottom:20px; }
  .mode-btn{ display:block; width:100%; text-align:left; border:2px solid var(--line); background:var(--card); border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer; transition:border-color .15s, transform .1s; }
  .mode-btn:hover{ border-color:var(--blue); }
  .mode-btn:active{ transform:scale(.99); }
  .logo-badge{ display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; background:var(--blue); color:#fff; font-size:16px; vertical-align:-9px; margin-right:9px; }
  .mb-ic{ display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:10px; background:var(--chip-bg); color:var(--blue); font-size:16px; vertical-align:-9px; margin-right:10px; }
  .mode-btn .t{ font-size:17px; font-weight:700; color:var(--ink); display:inline; vertical-align:middle; }
  .mode-btn .d{ font-size:14px; color:var(--muted); margin-top:2px; }
  .note{ font-size:13px; color:var(--muted); margin-top:14px; }
  .progress-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:8px; }
  .bar{ height:8px; background:var(--line); border-radius:999px; overflow:hidden; margin-bottom:20px; }
  .bar i{ display:block; height:100%; background:var(--blue); width:0%; transition:width .3s; }
  .q-text{ font-size:19px; font-weight:600; line-height:1.4; margin-bottom:18px; }
  .opt{ display:block; width:100%; text-align:left; border:2px solid var(--line); background:var(--card); border-radius:12px; padding:14px 16px; margin-bottom:10px; font-size:16px; cursor:pointer; color:var(--ink); }
  .opt:hover{ border-color:var(--blue); }
  .opt.selected{ border-color:var(--blue); background:var(--chip-bg); }
  .opt.correct{ border-color:var(--ok); background:var(--ok-bg); }
  .opt.wrong{ border-color:var(--bad); background:var(--bad-bg); }
  .opt:disabled{ cursor:default; }
  .why{ border-radius:12px; padding:14px 16px; font-size:14.5px; margin:6px 0 14px; display:none; }
  .why.show{ display:block; }
  .why.ok{ background:var(--ok-bg); }
  .why.bad{ background:var(--bad-bg); }
  .why .verdict{ font-weight:800; display:block; margin-bottom:4px; }
  .why.ok .verdict{ color:var(--ok); }
  .why.bad .verdict{ color:var(--bad); }
  .btn{ display:inline-block; background:var(--blue); color:#fff; border:none; border-radius:12px; padding:13px 26px; font-size:16px; font-weight:700; cursor:pointer; }
  .btn:hover{ background:var(--blue-dark); }
  .btn.ghost{ background:var(--card); color:var(--blue); border:2px solid var(--blue); }
  .btn[disabled]{ opacity:.45; cursor:default; }
  .actions{ margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; }
  .result-big{ font-size:40px; font-weight:800; text-align:center; margin:6px 0 2px; }
  .result-status{ text-align:center; font-size:18px; font-weight:800; margin-bottom:6px; }
  .result-status.pass{ color:var(--ok); }
  .result-status.fail{ color:var(--bad); }
  .result-note{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:18px; }
  .review h3{ font-size:16px; margin:18px 0 10px; }
  .review-item{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:14.5px; }
  .review-item .rq{ font-weight:600; margin-bottom:6px; }
  .review-item .ra{ color:var(--bad); }
  .review-item .rc{ color:var(--ok); font-weight:600; }
  footer{ margin-top:22px; font-size:12.5px; color:var(--muted); text-align:center; line-height:1.6; }
  footer a{ color:var(--blue); }

  .prem-badge{ display:inline-block; background:#F59E0B; color:#fff; font-size:11px; font-weight:800; padding:2px 9px; border-radius:999px; vertical-align:middle; margin-left:8px; letter-spacing:.4px; }
  .q-timer{ font-weight:700; color:var(--ink); }
  .q-timer.low{ color:var(--bad); }
  .feat{ list-style:none; margin:6px 0 14px; }
  .feat li{ position:relative; padding:7px 0 7px 32px; font-size:15px; }
  .feat li i{ position:absolute; left:2px; top:10px; color:var(--blue); width:20px; text-align:center; }
  .price{ font-size:23px; font-weight:800; text-align:center; margin:8px 0 2px; }
  .price-note{ text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:16px; }
  .pay-err{ display:none; background:var(--bad-bg); color:var(--bad); border-radius:12px; padding:12px 14px; font-size:14.5px; margin-top:12px; }
  .pay-err.show{ display:block; }
  .pay-info{ display:none; background:var(--chip-bg); color:var(--ink); border-radius:12px; padding:12px 14px; font-size:14.5px; margin-top:12px; text-align:center; }
  .pay-info.show{ display:block; }
  .owned{ display:none; background:var(--ok-bg); color:var(--ok); border-radius:12px; padding:12px 14px; font-size:14.5px; text-align:center; margin-top:12px; font-weight:600; }
  .owned.show{ display:block; }
  .topics h3{ font-size:16px; margin:18px 0 10px; }
  .topic-row{ margin-bottom:10px; font-size:14px; }
  .topic-row .tr-head{ display:flex; justify-content:space-between; margin-bottom:4px; }
  .topic-row .bar{ margin-bottom:0; }
  .topic-row .bar i{ background:var(--ok); transition:width .3s; }
  .topic-row.weak .bar i{ background:var(--bad); }
  .topic-row .weak-tag{ color:var(--bad); font-weight:700; }
  .review h4{ font-size:15px; margin:16px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><span class="logo-badge"><i class="fa-solid fa-car-side"></i></span>DMV<span>Test</span> CA<span class="demo-badge">Demo</span></div>
    <div class="langs">
      <button data-lang="hy" onclick="setLang('hy')">Հայ</button>
      <button data-lang="ru" onclick="setLang('ru')">Рус</button>
      <button data-lang="en" onclick="setLang('en')">Eng</button>
    </div>
  </header>

  <section id="screen-home" class="card">
    <h1 id="t-title"></h1>
    <p class="sub" id="t-sub"></p>
    <button class="mode-btn" onclick="startQuiz('practice')">
      <span class="mb-ic"><i class="fa-solid fa-book-open"></i></span><div class="t" id="t-practice"></div>
      <div class="d" id="t-practice-d"></div>
    </button>
    <button class="mode-btn" onclick="openExam()">
      <span class="mb-ic"><i class="fa-solid fa-stopwatch"></i></span><div class="t" id="t-exam"></div><span class="prem-badge" id="t-prem-badge"></span>
      <div class="d" id="t-exam-d"></div>
    </button>
    <p class="note" id="t-note"></p>
  </section>

  <section id="screen-paywall" class="card" style="display:none">
    <h1 id="p-title"></h1>
    <p class="sub" id="p-sub"></p>
    <ul class="feat">
      <li><i class="fa-solid fa-stopwatch"></i><span id="p-f1"></span></li>
      <li><i class="fa-solid fa-layer-group"></i><span id="p-f2"></span></li>
      <li><i class="fa-solid fa-chart-simple"></i><span id="p-f3"></span></li>
    </ul>
    <div class="price" id="p-price"></div>
    <div class="price-note" id="p-price-note"></div>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="btn-buy" onclick="buyPremium()"></button>
      <button class="btn ghost" id="btn-pay-home" onclick="goHome()"></button>
    </div>
    <div class="pay-info" id="p-info"></div>
    <div class="pay-err" id="p-err"></div>
    <div class="owned" id="p-owned"></div>
    <p class="note" id="p-restore-note"></p>
  </section>

  <section id="screen-quiz" class="card" style="display:none">
    <div class="progress-row"><span id="q-count"></span><span class="q-timer" id="q-timer" style="display:none"></span><span id="q-mode"></span></div>
    <div class="bar"><i id="q-bar"></i></div>
    <div class="q-text" id="q-text"></div>
    <div id="q-opts"></div>
    <div class="why" id="q-why"><span class="verdict" id="q-verdict"></span><span id="q-why-text"></span></div>
    <div class="actions">
      <button class="btn" id="btn-next" onclick="nextQuestion()"></button>
    </div>
  </section>

  <section id="screen-result" class="card" style="display:none">
    <div class="result-big" id="r-score"></div>
    <div class="result-status" id="r-status"></div>
    <p class="result-note" id="r-note"></p>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="btn-again" onclick="restart()"></button>
      <button class="btn ghost" id="btn-home" onclick="goHome()"></button>
      <button class="btn ghost" id="btn-share" onclick="shareResult()"></button>
    </div>
    <div class="topics" id="r-topics"></div>
    <div class="review" id="r-review"></div>
  </section>

  <footer id="t-footer"></footer>
</div>

{q:"Ինչպե՞ս է նշվում ձախ շրջադարձի համար կենտրոնական գոտին։", o:["Կրկնակի դեղին գծերով. դրսից հոծ, ներսից ընդհատվող","Երկու կողմից կրկնակի հոծ սպիտակ գծերով","Ճանապարհի մեջտեղում մեկ հոծ սպիտակ գծով"], c:0, w:"Ձախ շրջադարձի կենտրոնական գոտին սահմանափակվում է կրկնակի դեղին գծերով՝ դրսից հոծ, ներսից ընդհատվող։"},
{q:"Ի՞նչ են նշանակում մայրուղու գոտիների վերևի ազդանշանները։", o:["Կարմիր X-ը ընդամենը խորհուրդ է գոտի փոխել","Կարմիր X-ը նշանակում է, որ այդ գոտով երբեք չի կարելի վարել. կանաչ սլաքը թույլ է տալիս օգտագործել գոտին","Ազդանշանները գործում են միայն պիկ ժամերին"], c:1, w:"Վերևի ազդանշանները կառավարում են յուրաքանչյուր գոտի. կարմիր X-ը փակում է գոտին, կանաչ սլաքը՝ բացում։"},
{q:"Ի՞նչ է նշանակում շեղանկյան պատկերը գոտու կամ նշանի վրա։", o:["HOV գոտի՝ նվազագույն թվով ուղևորներ ունեցող մեքենաների համար, թիվը նշված է նշանի վրա","Գոտի միայն ավտոբուսների համար","Գոտի, որտեղ պետք է միացնել հեռահար լույսը"], c:0, w:"Շեղանկյունը նշում է բարձր զբաղվածությամբ մեքենաների գոտին, իսկ նշանը ցույց է տալիս, թե քանի ուղևոր է պահանջվում։"},
{q:"Նշանների գույները ստանդարտ նշանակություններ ունեն. նարնջագույն՝ շինարարություն, դեղին՝ ընդհանուր զգուշացումներ, կապույտ՝ ծառայություններ, շագանակագույն՝ այգիներ և հանգստի գոտիներ։ Ո՞ր գույնն է օգտագործվում ուղղության ցուցանակների համար։", o:["Շագանակագույն","Նարնջագույն","Կանաչ"], c:2, w:"Կանաչ նշանները տալիս են ուղղություններ և ուղեցուցային տեղեկություն, իսկ մյուս գույները նշում են զգուշացումներ, աշխատանքի գոտիներ, ծառայություններ և հանգստի վայրեր։"},
{q:"Ի՞նչ են զգուշացնում ֆլուորեսցենտ դեղնականաչ նշանները։", o:["Դպրոցական գոտիների, հետիոտնային և հեծանվային անցումների մասին","Մայրուղու ելքերի և մղոնի սյուների մասին","Վճարովի ճանապարհների և արագընթաց գոտիների մասին"], c:0, w:"Ֆլուորեսցենտ դեղնականաչը օգտագործվում է դպրոցական գոտիների և հետիոտնային ու հեծանվային անցումների համար։"},
{q:"Դեղին շեղանկյունաձև զգուշացնող նշանի տակ թիվ ցույց տվող փոքր վահանակ կա։ Ի՞նչ թիվ է դա։", o:["Հեռավորությունը մղոններով մինչև վտանգը","Այդ հատվածի արագության նոր օրինական սահմանափակումը","Խորհուրդ տրվող (advisory) արագությունը շրջադարձի կամ ելքի համար"], c:2, w:"Զգուշացնող նշանի տակ գտնվող թվային վահանակը տալիս է խորհուրդ տրվող արագությունը, որն անվտանգ է շրջադարձի կամ ելքի համար։"},
{q:"Ի՞նչ է նշանակում Merge (հոսքերի միաձուլում) նշանը։", o:["Ձեր գոտին ավարտվում է, և երթևեկությունը դադարում է","Երթևեկությունը կողքից միանում է ձեր գոտուն. հարմարեցրեք արագությունն ու դիրքը","Դուք պարտավոր եք անմիջապես գոտի փոխել"], c:1, w:"Merge նշանը զգուշացնում է, որ երթևեկությունը կողքից մտնելու է ձեր ճանապարհը, ուստի հարմարեցրեք արագությունն ու հեռավորությունը։"},
{q:"Ի՞նչ է նշանակում ALL WAY վահանակը «ՍՏՈՊ» նշանի տակ։", o:["Կանգնում են միայն ամենամեծ մեքենաները","Կարող եք անցնել առանց կանգնելու, եթե ճանապարհը դատարկ է թվում","Բոլոր ուղղություններից եկող երթևեկությունը պարտավոր է կանգնել խաչմերուկի մոտ"], c:2, w:"ALL WAY-ը նշանակում է, որ բոլոր ուղղություններից մոտեցող վարորդներն ունեն «ՍՏՈՊ» նշան և պարտավոր են կանգնել։"},
{q:"Ո՞րն է միակ կլոր ճանապարհային նշանը և ի՞նչ է այն զգուշացնում։", o:["Առջևում երկաթուղային անցում է","Առջևում դպրոցի մոտի անցում է","Առջևում շրջանաձև երթևեկություն է"], c:0, w:"Կլոր նշանը եզակի է. այն նախապես զգուշացնում է առջևում գտնվող երկաթուղային անցման մասին։"},
{q:"Ի՞նչ են նշանակում DO NOT ENTER և WRONG WAY նշանները։", o:["Ճանապարհը փակ է վերանորոգման համար","Դուք մտնում եք ճանապարհ երթևեկությանը հակառակ և այդտեղով երթևեկել չի կարելի","Արգելքը գործում է միայն առևտրային տրանսպորտի համար"], c:1, w:"Այս նշանները նշանակում են, որ պատրաստվում եք վարել երթևեկության հոսքին հակառակ. հետ դարձեք և մի՛ մտեք։"},
{q:"Ի՞նչ է նշանակում կարմիր ներկված եզրաքարը։", o:["Ուղևորների նստեցումը թույլատրվում է հինգ րոպեով","Կայանումը թույլատրվում է միայն գիշերը","Կանգառն ու կայանումը արգելվում են բոլոր ժամերին"], c:2, w:"Կարմիր եզրաքարը հրդեհային գոտի է, որտեղ կանգառն ու կայանումը միշտ արգելված են։"},
{q:"Ի՞նչ է նշանակում դեղին ներկված եզրաքարը։", o:["Բեռների բեռնման և առևտրային բեռնման գոտի","Միայն ուղևորների իջեցման գոտի","Կայանատեղի միայն հաշմանդամների համար"], c:0, w:"Դեղին եզրաքարերը նշում են բեռնման գոտիներ, որտեղ առևտրային մեքենաները բեռնում և բեռնաթափում են բեռներ։"},
{q:"Ի՞նչ է նշանակում կապույտ ներկված եզրաքարը։", o:["Կայանում միայն էլեկտրամեքենաների համար","Կայանում միայն հաշմանդամների համար՝ հատուկ ցուցանակով կամ համարանիշով","Ընդհանուր կայանում՝ առանց ժամանակի սահմանափակման"], c:1, w:"Կապույտ եզրաքարերը կայանումը նախատեսում են հաշմանդամների համար՝ գործող ցուցանակով կամ համարանիշով։"},
{q:"Ի՞նչ է թույլ տալիս սպիտակ եզրաքարը և ի՞նչ է նշանակում կանաչ եզրաքարը։", o:["Սպիտակը՝ ուղևորների նստեցման և իջեցման համար. կանաչը՝ կայանում սահմանափակ ժամանակով","Սպիտակը՝ բեռների բեռնման համար. կանաչը՝ կայանում արգելված է","Երկու գույներն էլ նշանակում են անսահմանափակ կայանում"], c:0, w:"Սպիտակ եզրաքարերը ուղևորների նստեցման և իջեցման համար են, իսկ կանաչ եզրաքարերը թույլ են տալիս կայանում նշանի վրա գրված ժամանակով։"},
{q:"Կարո՞ղ եք կայանել հաշմանդամների կայանատեղու հարևանությամբ գծանշված գոտում, եթե ունեք հաշմանդամի ցուցանակ։", o:["Այո, ցուցանակը դա թույլ է տալիս","Այո, բայց միայն մի քանի րոպեով","Ոչ. գծանշված մուտքի գոտում կայանումը արգելվում է նույնիսկ ցուցանակով"], c:2, w:"Հաշմանդամների տեղի կողքի գծանշված գոտին մուտքի անցուղի է և պետք է միշտ ազատ մնա։"},
{q:"Որտե՞ղ են Կալիֆոռնիայում հաճախ հանդիպում դեղին հետիոտնային անցումները։", o:["Դպրոցների մոտ","Մայրուղիների մուտքերի մոտ","Միայն քաղաքների գործարար կենտրոններում"], c:1, w:"Դեղին հետիոտնային անցումներն օգտագործվում են դպրոցների մոտի անցումները նշելու համար։"},
{q:"Ի՞նչ պետք է սպասեք, երբ տեսնում եք «առջևում լուսացույց» զգուշացնող նշանը։", o:["Լուսացույցը խափանված է, և կարող եք այն անտեսել","Պատրաստ եղեք կանգնել առջևի լուսացույցի մոտ","Դուք պարտավոր եք շրջվել հաջորդ անկյունում"], c:1, w:"«Լուսացույց առջևում» զգուշացնող նշանը հուշում է պատրաստ լինել կանգնելու մոտեցող լուսացույցի մոտ։"},
{q:"Ի՞նչ է հայտնում մայրուղու ելքի թեքահարթակի վրա խորհուրդ տրվող արագության նշանը։", o:["Ելքի օրինական առավելագույն արագությունը ցանկացած եղանակին","Հեռավորությունը մինչև հաջորդ ելք","Ելքով անվտանգ վարելու համար խորհուրդ տրվող արագությունը"], c:2, w:"Ելքի խորհուրդ տրվող արագության նշանները առաջարկում են անվտանգ արագություն թեքահարթակի կորի համար։"},

{q:"Հետիոտնը չպետք է հանկարծակի մայթից իջնի մոտ եկող մեքենայի ճանապարհին, բայց դուք որպես վարորդ՝", o:["Կարող եք ենթադրել, որ հետիոտնը կկանգնի ձեզ համար","Ոչինչ պարտավոր չեք, եթե հետիոտնն անցումից դուրս է","Միևնույն է պարտավոր եք զիջել և զգուշությամբ խուսափել ցանկացած հետիոտնի վրաերթից"], c:2, w:"Նույնիսկ երբ հետիոտնը խախտում է կանոնը, վարորդները պարտավոր են զիջել ճանապարհը և զգուշությամբ խուսափել բախումից։"},
{q:"Դպրոցական ավտոբուսները և վտանգավոր բեռ տեղափոխող որոշ բեռնատար ցիստեռններ պարտավոր են՝", o:["Կանգնել յուրաքանչյուր երկաթուղային անցման մոտ, նույնիսկ երբ ազդանշանները չեն թարթում","Կանգնել միայն երբ գնացք է երևում","Դանդաղեցնել, բայց երբեք չկանգնել անցումների մոտ"], c:0, w:"Դպրոցական ավտոբուսները և որոշ բեռնատար ցիստեռններ պարտավոր են կանգնել բոլոր երկաթուղային անցումների մոտ, անկախ նրանից ազդանշանները գործում են, թե ոչ։"},
{q:"«ՍՏՈՊ» նշանի մոտ, եթե շենքերը կամ կայանված մեքենաները փակում են տեսադաշտը, դուք պետք է՝", o:["Դանդաղ անցնեք առանց կանգնելու","Կանգնեք կանգառի գծի մոտ, հետո դանդաղ առաջ շարժվեք և կրկին կանգնեք՝ երթևեկությունը տեսնելու համար","Երկու անգամ ազդանշան տաք և առաջ շարժվեք"], c:1, w:"Նախ կանգնեք կանգառի գծի մոտ. հետո դանդաղ առաջ շարժվեք և կրկին կանգնեք, մինչև հստակ տեսնեք հատվող երթևեկությունը։"},
{q:"Եթե լուսացույցն ամբողջությամբ չի գործում և ոչ մի ազդանշան չի ցույց տալիս, խաչմերուկը վարեք՝", o:["Ինչպես մայրուղի մտնելու թեքահարթակ","Ինչպես եթե կանաչ լույսը ձերն է","Ինչպես բոլոր կողմերից «ՍՏՈՊ» նշաններով խաչմերուկ. կանգնեք և զիջեք այդ կանոններով"], c:2, w:"Ամբողջությամբ չգործող լուսացույցը խաչմերուկը դարձնում է բոլոր կողմերից «ՍՏՈՊ» նշաններով խաչմերուկ։"},
{q:"Առջևի բեռնատարը լայն շառավղով աջ շրջադարձ է կատարում։ Դուք պետք է՝", o:["Երբեք չմտնեք բեռնատարի և եզրաքարի արանքը","Արագ շրջանցեք բեռնատարը աջից","Մոտենաք բեռնատարին՝ տեղ խնայելու համար"], c:0, w:"Բեռնատարներին աջ շրջադարձի համար լայն շառավիղ է պետք, այնպես որ երբեք մի դրեք ձեր մեքենան շրջադարձ կատարող բեռնատարի և եզրաքարի արանքում։"},
{q:"Հեծանվորդը կարող է օրինական կերպով երթևեկել գոտու կենտրոնով՝", o:["Միայն առանց մեքենաների փողոցներում","Ձախ շրջադարձ կատարելիս կամ երբ գոտին չափազանց նեղ է մեքենայի հետ կողք կողքի անվտանգ երթևեկելու համար","Երբեք, հեծանիվները միշտ պետք է մնան եզրաքարի մոտ"], c:1, w:"Հեծանվորդները կարող են զբաղեցնել ամբողջ գոտին ձախ շրջադարձի համար կամ երբ գոտին չափազանց նեղ է հեծանիվի և մեքենայի համար կողք կողքի։"},
{q:"Դպրոցի մոտի անցման կարգավորողը (crossing guard) բարձրացրել է «ՍՏՈՊ» նշանը։ Դուք պետք է՝", o:["Զգուշությամբ շրջանցեք կարգավորողին","Ենթարկվեք միայն եթե երեխաներ են երևում","Ենթարկվեք կարգավորողի ազդանշաններին և նրա ձեռքի «ՍՏՈՊ» նշանին"], c:2, w:"Միշտ հետևեք դպրոցի մոտի անցման կարգավորողի ցուցումներին և նրա ձեռքում պահած «ՍՏՈՊ» նշանին։"},
{q:"Ձեր առջևի մեքենան կանգնել է հետիոտնային անցման մոտ։ Դուք չպետք է՝", o:["Շրջանցեք կամ վազանցեք այն. այն կարող է զիջել հետիոտնին, որին դուք չեք տեսնում","Ոչ մի դեպքում կանգնեք նրա հետևում","Կանգնելուց առաջ հետիոտներ փնտրեք"], c:0, w:"Երբեք մի վազանցեք անցման մոտ կանգնած մեքենային. նրա հետևում կարող է թաքնված լինել ճանապարհն անցնող հետիոտն։"},
{q:"Ճանապարհային աշխատանքների տեղամասում դրոշակակիրը (flagger) կարգավորում է երթևեկությունը։ Նրա ցուցումները՝", o:["Միայն խորհուրդներ են","Պարտադիր են կատարման համար, նույնիսկ եթե հակասում են նշաններին և լուսացույցներին","Գործում են միայն բեռնատարների համար"], c:1, w:"Դրոշակակիրն ունի նույն լիազորությունը, ինչ նշաններն ու լուսացույցները. ենթարկվեք նրան, նույնիսկ երբ նրա ցուցումները տարբերվում են դրանցից։"},
{q:"Ոստիկանը կարգավորում է երթևեկությունը խաչմերուկում, որտեղ կանաչ լույս է վառվում։ Դուք պետք է՝", o:["Հետևեք կանաչ լույսին, այն միշտ գլխավորն է","Կանգնեք և սպասեք, մինչև ոստիկանը հեռանա","Հետևեք ոստիկանի ցուցումներին՝ լուսացույցի ազդանշանների և նշանների փոխարեն"], c:2, w:"Երբ ոստիկանը կարգավորում է երթևեկությունը, հետևեք նրա ցուցումներին, այլ ոչ թե լուսացույցի ազդանշաններին կամ նշաններին։"},
{q:"Ձեր մոտ կանաչ լույս է, և դուք ուզում եք ձախ շրջադարձ կատարել։ Շրջադարձից առաջ պարտավոր եք զիջել՝", o:["Դիմացի մեքենաներին և ձեր ճանապարհն անցնող հետիոտներին","Ոչ մեկին. կանաչ լույսը ձեզ առավելություն է տալիս","Միայն կարմիր լույսով եկող մեքենաներին"], c:0, w:"Կանաչ լույսը չի պաշտպանում ձախ շրջադարձը. նախ զիջեք դիմացի երթևեկությանը և հետիոտներին։"},
{q:"Արագացման գոտով մայրուղի մտնելիս առավելությունը պատկանում է՝", o:["Ձեզ, որովհետև դուք արագանում եք","Արդեն մայրուղով երթևեկող տրանսպորտին","Նրան, ով առաջինն է ազդանշան տվել"], c:1, w:"Մայրուղի մտնող վարորդները պարտավոր են զիջել արդեն մայրուղու վրա գտնվող մեքենաներին և միաձուլվել հոսքին մայրուղու արագությամբ կամ դրան մոտ արագությամբ։"},
{q:"Երկու մեքենա հակադիր ուղղություններից մոտենում են խաչմերուկի. մեկը գնում է ուղիղ, մյուսը ձախ է շրջադարձ կատարում։ Ո՞վ է զիջում։", o:["Ուղիղ գնացող վարորդը","Երկուսն էլ պետք է ամբողջությամբ կանգնեն","Ձախ շրջադարձ կատարող վարորդը զիջում է ուղիղ գնացողին"], c:2, w:"Ձախ շրջադարձ կատարող վարորդը պարտավոր է զիջել դիմացի մեքենաներին, որոնք ուղիղ անցնում են խաչմերուկը։"},
{q:"Կայանատեղից կամ բակից հետադարձ ընթացքով դուրս գալիս դուք պետք է՝", o:["Զիջեք հետիոտներին և տրանսպորտին՝ փողոց դուրս գալուց առաջ","Արագ դուրս եկեք, մինչև տրանսպորտը կմոտենա","Սպասեք, որ մյուսները կանգնեն ձեզ համար"], c:0, w:"Ուշադիր ստուգեք իրավիճակը և զիջեք հետիոտներին ու մեքենաներին, երբ հետադարձ ընթացքով դուրս եք գալիս կայանատեղից կամ բակից։"},
{q:"Շրջանակից դուրս գալիս դուք նաև պետք է զիջեք՝", o:["Ձեր հետևից շրջանակ մտնող մեքենաներին","Ելքերի մոտի անցումներում գտնվող հետիոտներին","Ոչ մեկին, ելքերը միշտ ազատ են"], c:1, w:"Հետևեք շրջանակի ելքերի մոտ անցնող հետիոտներին և զիջեք նրանց, երբ լքում եք շրջանակը։"},
{q:"Ձեր լուսացույցը դարձել է կանաչ, բայց հետիոտնը դեռ անցնում է փողոցը իր ազդանշանով։ Դուք պետք է՝", o:["Ազդանշան տաք և շրջանցեք հետիոտնին","Դանդաղ շարժվեք՝ նրան շտապեցնելու համար","Սպասեք, մինչև հետիոտնը կավարտի անցումը, և միայն հետո շարժվեք"], c:2, w:"Նույնիսկ կանաչ լույսի դեպքում սպասեք, մինչև օրինական կերպով դեռ անցնող հետիոտները կավարտեն անցումը, նախքան կշարժվեք։"},
{q:"Ձեր լուսացույցը դարձել է կանաչ, բայց մեկ այլ մեքենա դեռ խաչմերուկի ներսում է։ Դուք պետք է՝", o:["Զիջեք արդեն խաչմերուկի ներսում գտնվող մեքենային՝ նախքան կմտնեք","Միևնույն է մտնեք. ձեր կանաչ լույսը ձեզ առավելություն է տալիս","Թարթեք լուսարձակները և առաջ շարժվեք"], c:0, w:"Մի մտեք խաչմերուկ, մինչև նրա ներսում գտնվող մեքենաները չեն ազատել այն, նույնիսկ երբ ձեր լույսը կանաչ է։"},

{q:"Ի՞նչ է նշանակում ընդհատ դեղին կենտրոնական գիծը։", o:["Երկու կողմերում երթևեկությունը միևնույն ուղղությամբ է","Երթևեկությունը հանդիպակաց է. շրջանցումը թույլատրվում է, երբ անվտանգ է","Շրջանցումը երբեք չի թույլատրվում"], c:1, w:"Ընդհատ դեղին գիծը բաժանում է հանդիպակաց երթևեկությունը, և շրջանցումը թույլատրվում է, երբ այն անվտանգ է։"},
{q:"Ձեր կողմում հոծ դեղին գիծ է, իսկ հակառակ կողմում՝ ընդհատ դեղին գիծ։ Ի՞նչ է սա նշանակում։", o:["Շրջանցումը թույլատրվում է ձեր կողմից","Շրջանցումը թույլատրվում է երկու կողմից","Շրջանցումը թույլատրվում է միայն ընդհատ գծի կողմից"], c:2, w:"Երբ հոծ և ընդհատ դեղին գծերը զույգով են, շրջանցել կարող է միայն ընդհատ գծի կողմի երթևեկությունը։"},
{q:"Ի՞նչ է նշանակում ընդհատ սպիտակ գիծը գոտիների միջև։", o:["Գոտիները հանդիպակաց ուղղությունների են","Այն երբեք չի կարելի հատել","Գոտիները միևնույն ուղղության են, և գոտի փոխելը թույլատրվում է"], c:2, w:"Ընդհատ սպիտակ գծերը բաժանում են միևնույն ուղղությամբ երթևեկող գոտիները, և գոտի փոխելը թույլատրվում է։"},
{q:"Ի՞նչ է հուշում գոտիների միջև մեկ հոծ սպիտակ գիծը։", o:["Մնացեք ձեր գոտում. գոտի փոխելը չի խրախուսվում","Այն կարելի է ազատորեն հատել ցանկացած պահի","Աջ գոտին ավարտվում է"], c:0, w:"Հոծ սպիտակ գիծը սահմանում է միևնույն ուղղության գոտիները և հուշում է մնալ ձեր գոտում ու խուսափել գոտի փոխելուց։"},
{q:"Ի՞նչ գույնի են ճանապարհի եզրագծերը։", o:["Աջ կողմում՝ հոծ դեղին, ձախ կողմում՝ հոծ սպիտակ","Աջ կողմում՝ հոծ սպիտակ. բաժանված մայրուղու ձախ եզրագիծը դեղին է","Երկու եզրագծերն էլ միշտ դեղին են"], c:1, w:"Աջ եզրագիծը հոծ սպիտակ է, իսկ բաժանված մայրուղու ձախ եզրը նշվում է դեղին գծով։"},
{q:"Կրկնակի հոծ դեղին գծերի մեկ զույգը կարելի է հատել՝", o:["Դանդաղ մեքենան շրջանցելու համար","Ցանկացած տեղում հետադարձ կատարելու համար","Ձախ թեքվելով բակ մտնելու կամ բակից դուրս գալու համար"], c:2, w:"Կրկնակի հոծ դեղին գծերի մեկ զույգը կարելի է հատել բակ ձախ մտնելու կամ բակից դուրս գալու համար. դա արգելապատ չէ։"},
{q:"Ինչպե՞ս կարելի է օգտագործել ձախ շրջադարձի կենտրոնական գոտին։", o:["Միայն ձախ շրջադարձին պատրաստվելու և այն կատարելու համար՝ գոտում վարելով ոչ ավելի, քան 200 ֆուտ","Որպես սովորական երթևեկելի գոտի, երբ երթևեկությունը խիտ է","Դանդաղ երթևեկությունը շրջանցելու համար"], c:0, w:"Ձախ շրջադարձի կենտրոնական գոտին միայն ձախ շրջադարձների համար է, և նրանում չի կարելի վարել 200 ֆուտից ավելի։"},

{q:"Աջից շրջանցումը թույլատրվում է՝", o:["Ճամփեզրով, երբ առջևի գոտին դանդաղում է","Երբ առջևի մեքենան թեքվում է ձախ, բազմագոտի ճանապարհին կամ միակողմանի փողոցում","Միայն հողե ճամփեզրներով"], c:1, w:"Աջից կարելի է շրջանցել, երբ առջևի մեքենան թեքվում է ձախ, կամ բազմագոտի կամ միակողմանի ճանապարհին, բայց երբեք՝ ճամփեզր իջնելով։"},
{q:"Չի կարելի սկսել շրջանցումը հետևյալից 100 ֆուտի մեջ՝", o:["Բենզալցակայանի մուտքից","Կայանված մեքենայից","Խաչմերուկից, երկաթուղային անցումից, կամրջից կամ սահմանափակ տեսադաշտով թունելից"], c:2, w:"Շրջանցումն արգելվում է խաչմերուկներից, երկաթուղային անցումներից, կամուրջներից և թունելներից 100 ֆուտի մեջ, որտեղ տեսադաշտը փակ է։"},
{q:"Երբ մեկ այլ մեքենա շրջանցում է ձեզ, դուք պետք է՝", o:["Արագությունը բարձրացնեք, որ վարորդը չկարողանա ավարտել շրջանցումը","Մնաք աջ կողմում և չբարձրացնեք արագությունը","Տեղափոխվեք ձախ՝ տեղ տալու համար"], c:1, w:"Երբ ձեզ շրջանցում են, մնացեք աջ կողմում և մի արագացեք. թող մյուս վարորդն անվտանգ շրջանցի։"},
{q:"Ո՞րն է Կալիֆոռնիայում բեռնատարների և կցորդ քաշող մեքենաների առավելագույն արագությունը։", o:["55 մղոն/ժ, և նրանք պետք է մնան աջ գոտիներում","65 մղոն/ժ ցանկացած գոտում","60 մղոն/ժ ձախ գոտում"], c:0, w:"Բեռնատարները և կցորդով մեքենաները սահմանափակված են 55 մղոն/ժ-ով և պետք է օգտագործեն աջ գոտիները. քառագոտի մայրուղու երկրորդ գոտին միայն շրջանցման համար է։"},
{q:"Եթե ձախ գոտում վարում եք երթևեկության հոսքից դանդաղ՝", o:["Ամեն ինչ կարգին է, քանի դեռ թույլատրելի արագությամբ եք","Ձեզ կարող են տուգանել նույնիսկ թույլատրելի արագությամբ. դանդաղ երթևեկությունը պետք է լինի աջ կողմում","Պետք է միացնեք վթարային լույսերը և շարունակեք"], c:1, w:"Ձախ գոտում դանդաղ վարելը կարող է տուգանքի պատճառ դառնալ նույնիսկ թույլատրելի արագությամբ. դանդաղ երթևեկությունը պետք է մնա աջ կողմում։"},
{q:"Մայրուղու հոսքին միանալիս դուք պետք է՝", o:["Կանգնեք արագացման գոտու վերջում և սպասեք մեծ բացատի","Մտնեք դանդաղ՝ երթևեկության արագությունից շատ ցածր","Արագացնեք մինչև երթևեկության արագությունը կամ մոտ դրան և չկանգնեք արագացման գոտում, եթե հոսքը կանգնած չէ"], c:2, w:"Օգտագործեք մուտքի թեքահարթակը մայրուղու երթևեկության արագությանը հասնելու համար և մի կանգնեք այնտեղ, եթե ինքը՝ երթևեկությունը, կանգնած չէ։"},
{q:"Եթե բաց եք թողել ձեր ելքը մայրուղուց, դուք պետք է՝", o:["Շարունակեք մինչև հաջորդ ելքը","Ճամփեզրով հետ գնաք դեպի ելքը","Հետադարձ արեք բաժանարար գոտու վրայով"], c:0, w:"Եթե բաց եք թողել ելքը, շարունակեք մինչև հաջորդը. երբեք հետ մի գնացեք և մի շրջվեք մայրուղու վրա։"},
{q:"Մայրուղու, նրա մուտքի կամ ելքի վրա հետընթաց վարելը՝", o:["Թույլատրվում է ճամփեզրով","Արգելվում է և շատ վտանգավոր է","Թույլատրվում է կարճ հեռավորությամբ՝ վթարային լույսերը միացրած"], c:1, w:"Երբեք հետընթաց մի վարեք մայրուղու կամ նրա թեքահարթակների վրա. դա անօրինական է և չափազանց վտանգավոր։"},
{q:"Եթե ձեր մեքենան փչանում է մայրուղու վրա, դուք պետք է՝", o:["Լիովին դուրս գաք աջ ճամփեզր, միացնեք վթարային լույսերը և օգնություն կանչեք","Կանգնեք ամենամոտ երթևեկելի գոտում","Մնաք գոտում և ձեռքով նշան անեք անցնող մեքենաներին"], c:0, w:"Լիովին դուրս եկեք ճանապարհից՝ աջ ճամփեզր, միացրեք վթարային լույսերը և օգնություն կանչեք։"},
{q:"Գոտի փոխելուց առաջ դուք պետք է՝", o:["Միայն նայեք հայելիներին","Նախ միացնեք ազդանշանը, հետո մեկ անգամ նայեք շարժվելիս","Նայեք հայելիներին, միացնեք ազդանշանը և ուսի վրայով նայեք կույր գոտին՝ փոխելով մեկ գոտի միանգամից"], c:2, w:"Ստուգեք հայելիները, միացրեք ազդանշանը, ուսի վրայով նայեք կույր գոտին մաքրելու համար և տեղափոխվեք մեկ գոտի միանգամից։"},
{q:"Երբ ձեր գոտին ավարտվում է և երթևեկությունը միաձուլվում է, ո՞վ պետք է զիջի։", o:["Շարունակվող գոտու երթևեկությունը պետք է զիջի ձեզ","Դուք պետք է զիջեք շարունակվող գոտու երթևեկությանը","Առաջինը գնում է ավելի դանդաղը"], c:1, w:"Երբ ձեր գոտին ավարտվում է, միաձուլվելիս պետք է զիջեք շարունակվող գոտու մեքենաներին։"},
{q:"Ինչի՞ց պետք է խուսափեք մեկ այլ մեքենայի մոտ։", o:["Մնալ նրա կույր գոտում. շրջանցեք նրան կամ հետ մնացեք","Հայելիներն օգտագործելուց","Ձեր գոտում նույն արագությամբ՝ շատ հետևում վարելուց"], c:0, w:"Մի մնացեք մեկ այլ վարորդի կույր գոտում. արագացեք՝ շրջանցելու համար, կամ դանդաղեք և հետ մնացեք։"},
{q:"Ինչպե՞ս պետք է կարգավորեք հեռավորությունը թաց ճանապարհին։", o:["Պահպանեք սովորական երեք վայրկյանը","Կրճատեք այն՝ ավելի արագ արձագանքելու համար","Մեծացրեք այն՝ կրկնապատկելով կամ եռապատկելով բացատը, իսկ ձյան վրա՝ ավելի շատ"], c:2, w:"Թաց ճանապարհին շատ ավելի մեծ հեռավորություն է պետք. կրկնապատկեք կամ եռապատկեք ինտերվալը, իսկ ձյան վրա՝ մեծացրեք ավելի շատ։"},
{q:"Ինչպե՞ս պետք է կարգավորեք արագությունը վատ եղանակին։", o:["Թաց ճանապարհին նվազեցրեք արագությունը 5-10 մղոն/ժ-ով, սեղմված ձյան վրա՝ կիսով չափ, իսկ սառույցի վրա՝ մինչև նվազագույնը","Պահպանեք թույլատրելի արագությունը, որ հոսքը չկանգնի","Դանդաղեք միայն ջրափոսեր տեսնելիս"], c:0, w:"Թաց ճանապարհին նվազեցրեք արագությունը 5–10 մղոն/ժ-ով, սեղմված ձյան վրա վարեք կիսով չափ արագությամբ, իսկ սառույցի վրա՝ նվազագույն արագությամբ։"},
{q:"Հեծանվորդին շրջանցելիս Կալիֆոռնիայի օրենքը պահանջում է թողնել առնվազն՝", o:["Մեկ ֆուտ տարածություն","Երեք ֆուտ տարածություն","Հատուկ բացատ չի պահանջվում"], c:1, w:"Կալիֆոռնիայի երեք ֆուտի օրենքը պահանջում է շրջանցելիս ձեր մեքենայի և հեծանվի միջև թողնել առնվազն երեք ֆուտ։"},
{q:"Մոտոցիկլիստն իրավունք ունի՝", o:["Կիսել ձեր գոտու կեսը՝ ձեր կողքին","Միշտ օգտագործել ճամփեզրը","Գոտու ամբողջ լայնությանը. մի փորձեք նրա հետ նույն գոտում կողք-կողքի գնալ"], c:2, w:"Մոտոցիկլին անհրաժեշտ է իր գոտու ամբողջ լայնությունը, այնպես որ երբեք մի խցկվեք նրա կողքին նույն գոտում։"},
{q:"Երկգոտի ճանապարհին շրջանցելուց հետո վերադարձեք ձեր գոտի՝", o:["Հենց որ հավասարվեք շրջանցած մեքենային","Երբ նրան մեկ մեքենայի երկարությամբ անցնեք, նույնիսկ եթե արագությունը գերազանցում եք","Երբ հայելու մեջ տեսնում եք շրջանցած մեքենայի լուսարձակները՝ չգերազանցելով թույլատրելի արագությունը"], c:2, w:"Վերադարձեք միայն այն ժամանակ, երբ հետևի հայելու մեջ տեսնում եք շրջանցած մեքենայի լուսարձակները, և երբեք մի գերազանցեք արագությունը շրջանցելու համար։"},
{q:"Շրջանցումը չի թույլատրվում՝", o:["Բլուրների վրա, շրջադարձերում և ամենուր, որտեղ հանդիպակաց գոտին բավարար հեռավորությամբ չի երևում","Միայն անձրևի ժամանակ","Երկուսից ավելի գոտի ունեցող ցանկացած ճանապարհին"], c:0, w:"Մի շրջանցեք բլուրների վրա, շրջադարձերում կամ ամենուր, որտեղ հանդիպակաց գոտին բավականաչափ հեռու չի երևում անվտանգ շրջանցման համար։"},
{q:"Աջից շրջանցումը հողե ճամփեզրով կամ ճանապարհից դուրս՝", o:["Թույլատրվում է, երբ երթևեկությունը կանգնած է","Արգելվում է","Թույլատրվում է 25 մղոն/ժ-ից ցածր արագությամբ"], c:1, w:"Երբեք չի կարելի աջից շրջանցել՝ լքելով ճանապարհը կամ օգտագործելով հողե ճամփեզրը։"},
{q:"Դպրոցական ավտոբուսը թարթող կարմիր լույսերով կանգնած է բաժանված կամ բազմագոտի մայրուղու մյուս կողմում։ Հանդիպակաց երթևեկությունը՝", o:["Պետք է կանգնի բոլոր դեպքերում","Պետք է դանդաղեցնի մինչև 10 մղոն/ժ","Պետք չէ կանգնել, քանի որ ավտոբուսը բաժանարարի մյուս կողմում է"], c:2, w:"Բաժանված կամ բազմագոտի մայրուղու վրա հանդիպակաց երթևեկությունը չի կանգնում բաժանարարի մյուս կողմում գտնվող դպրոցական ավտոբուսի համար։"},
{q:"Երկգոտի ճանապարհին, երբ ձեր հետևում հինգ կամ ավելի մեքենա է հավաքվել, դուք պետք է՝", o:["Առաջին անվտանգ հնարավորության դեպքում թեքվեք ճամփեզրի լայն հատված կամ կայանատեղի և թողեք նրանք անցնեն","Արագացնեք մինչև թույլատրելի արագությունը և շարունակեք","Թեթևակի արգելակեք, որ նրանք հետ մնան"], c:0, w:"Երբ երկգոտի ճանապարհին ձեր հետևում հինգ կամ ավելի մեքենա է շարվել, օգտագործեք հաջորդ անվտանգ թեքման տեղը նրանց անցնել թողնելու համար։"},
{q:"Ձախ շրջադարձի կենտրոնական գոտում շրջադարձի սպասելիս դուք պետք է՝", o:["Թեքվեք հենց որ ձեր կողմն ազատվի՝ անտեսելով մյուս ուղղությունը","Հիշեք, որ գոտին օգտագործում են երկու ուղղությունների վարորդները, և հետևեք նույն գոտում հանդիպակաց մեքենաներին","Օգտագործեք գոտին կայանատեղի սպասելու համար"], c:1, w:"Ձախ շրջադարձի կենտրոնական գոտին օգտագործում են երկու ուղղությամբ գնացող վարորդները, այնպես որ սպասեք հոսքի բացատին և հետևեք նույն գոտին օգտագործող հանդիպակաց մեքենաներին։"}
];

{q:"Մառախուղի ժամանակ ո՞ր լուսարձակները պետք է օգտագործել։", o:["Հեռահար լույսը, որ ավելի հեռու տեսնեք","Միայն չափսի լույսերը","Միայն մերձահար լույսը"], c:2, w:"Հեռահար լույսը անդրադառնում է մառախուղից և կուրացնում է ձեզ, ուստի մառախուղի ժամանակ օգտագործեք միայն մերձահար լույսը։"},
{q:"Ուժեղ կողմնային քամին ամենավտանգավորն է՝", o:["Ցածր սպորտային մեքենաների համար","Լիաքարշակ մեքենաների համար","Բարձր մեքենաների, ֆուրգոնների և մոտոցիկլների համար"], c:2, w:"Բարձր մեքենաներն ու մոտոցիկլներն ամենաշատն են ենթարկվում քամուն. ամուր բռնեք ղեկը և նվազեցրեք արագությունը ուժեղ պոռթկումների ժամանակ։"},
{q:"Երկար զառիվայր իջնելիս պետք է՝", o:["Անցնել ցածր փոխանցման","Ամբողջ ճանապարհին ոտքը պահել արգելակի վրա","Անջատել շարժիչը և գլորվել"], c:0, w:"Ցածր փոխանցումը արգելակում է շարժիչով և թույլ չի տալիս արգելակներին գերտաքանալ երկար իջեցման ժամանակ։"},
{q:"Եթե արգելակները հանկարծ խափանվեն, նախ պետք է՝", o:["Մի քանի անգամ սեղմել և բաց թողնել արգելակի ոտնակը, հետո սահուն միացնել կայանման արգելակը և անցնել ցածր փոխանցման","Անմիջապես անջատել շարժիչը","Մեքենան ուղղել ուղիղ դեպի մոտակա խոչընդոտը"], c:0, w:"Ոտնակը պոմպելը կարող է վերականգնել ճնշումը. հետո սահուն ձգեք կայանման արգելակը և անցեք ցածր փոխանցման։"},
{q:"Եթե երթևեկելիս անվադողը պայթի, պետք է՝", o:["Անմիջապես կտրուկ արգելակել","Ամուր բռնել ղեկը, սահուն բաց թողնել գազը և զգուշորեն արգելակել, երբ մեքենան դանդաղի","Արագացնել, որ հասնեք արհեստանոց"], c:1, w:"Ամուր բռնեք ղեկը, թողեք մեքենան աստիճանաբար դանդաղի և զգուշորեն արգելակեք՝ դուրս գալով ճանապարհից։"},
{q:"Եթե ղեկը հանկարծ դադարի աշխատել, պետք է՝", o:["Շարունակել երթը մինչև մոտակա արհեստանոց","Արագացնել, որ մեքենան կայունանա","Բաց թողնել գազը, զգուշորեն արգելակել, միացնել վթարային ազդանշանը և դուրս գալ ճանապարհից"], c:2, w:"Ղեկի խափանման դեպքում սահուն դանդաղեք միացված վթարային ազդանշանով և դուրս եկեք ճանապարհից։"},
{q:"Հանդիպակաց մեքենան դուրս է եկել ձեր գոտի։ Ճակատային բախումից խուսափելու համար պետք է՝", o:["Նվազեցնել արագությունը, ղեկը տանել աջ և ազդանշան տալ","Կտրուկ գնալ ձախ՝ հանդիպակաց մեքենայի գոտին","Արագացնել, որ հասցնեք անցնել"], c:0, w:"Նվազեցրեք արագությունը, տեղափոխվեք աջ և ազդանշան տվեք. երբեք մի գնացեք հանդիպակաց գոտի։"},
{q:"Եթե մեքենայի հետևի մասը սկսում է սահել, պետք է՝", o:["Որքան հնարավոր է ուժեղ արգելակել","Բաց թողնել գազը և ղեկը պտտել այն ուղղությամբ, ուր պետք է գնա մեքենայի առաջնամասը","Ղեկը պտտել սահքի հակառակ ուղղությամբ"], c:1, w:"Սահքի ժամանակ բաց թողեք գազը և ղեկն ուղղեք այնտեղ, ուր պետք է գնա մեքենայի առաջնամասը՝ հետևի առանցքի սահքի ուղղությամբ։"},
{q:"Եթե մեքենան ունի հակաարգելակային համակարգ (ABS) և պետք է շտապ կանգնել, պետք է՝", o:["Բազմիցս պոմպել արգելակի ոտնակը","Սեղմել և բաց թողնել արգելակը կարճ իմպուլսներով","Ուժեղ սեղմել արգելակը և պահել այն"], c:2, w:"ABS-ի դեպքում ուժեղ սեղմեք արգելակը և պահեք. ոտնակը պոմպելը խանգարում է համակարգին։"},
{q:"Վարելիս քնկոտություն եք զգում։ Ամենաանվտանգը՝", o:["Դուրս գալ ճանապարհից և հանգստանալ կամ քնել, կամ ղեկը փոխանցել ուրիշին","Բացել պատուհանը և բարձրացնել ռադիոն","Սուրճ խմել և շարունակել ճանապարհը"], c:0, w:"Բաց պատուհանը, երաժշտությունն ու սուրճը հուսալի չեն. անվտանգ է կանգնել և հանգստանալ կամ փոխվել վարորդով։"},
{q:"Վտանգները ժամանակին նկատելու համար նայեք առաջ մոտ՝", o:["Մեկ մեքենայի երկարությամբ","Միայն հենց ձեր առաջի մեքենային","10–15 վայրկյանի ճանապարհ, քաղաքում դա մոտ մեկ թաղամաս է"], c:2, w:"10–15 վայրկյան առաջ նայելը՝ մոտ մեկ քաղաքային թաղամաս, ժամանակ է տալիս արձագանքել վտանգին։"},
{q:"Ձեր հետևից մեքենան երթևեկում է կպած ձեզ։ Պետք է՝", o:["Թեթև արգելակել, որ զգուշացնեք նրան","Տեղափոխվել և թողնել, որ անցնի","Արագացնել, որ մեծացնեք հեռավորությունը"], c:1, w:"Թողեք, որ կպչուն վարորդն անցնի. նրա դեմ կտրուկ արգելակելը կարող է վթարի կամ կոնֆլիկտի վերածվել։"},
{q:"Երթը սկսելուց առաջ պետք է՝", o:["Կարգավորել նավիգատորը և երաժշտությունը և երբեք հեռախոսը ձեռքում չպահել և հաղորդագրություն չգրել վարելիս","Հաղորդագրություններ գրել միայն կարմիր լույսի ժամանակ","Հեռախոսը պահել ցածր, որ չերևա"], c:0, w:"Նավիգատորն ու երաժշտությունը կարգավորեք երթից առաջ. հեռախոսը ձեռքում պահելը և հաղորդագրություն գրելն արգելվում է բոլոր վարորդներին։"},
{q:"Լուսաբացին խոշոր կենդանի (օրինակ՝ եղջերու) է դուրս եկել ճանապարհ։ Պետք է՝", o:["Կտրուկ շրջանցել նրան","Ազդանշան տալ և արագացնել","Արգելակել և հնարավորության դեպքում կանգնել"], c:2, w:"Հնարավորության դեպքում արգելակեք և կանգնեք. կտրուկ շրջադարձը կարող է ավելի ծանր վթարի հանգեցնել։"},
{q:"Կալիֆոռնիայի Kaitlyn օրենքով արգելվում է՝", o:["Մինչև 6 տարեկան երեխային միայնակ թողնել մեքենայում առանց 12 տարեկան և բարձր անձի հսկողության","Մինչև 6 տարեկան երեխային նստեցնել հետևի նստատեղին","Մինչև 6 տարեկան երեխայի հետ վարել մթությունից հետո"], c:0, w:"Kaitlyn օրենքն արգելում է մինչև 6 տարեկան երեխային առանց 12 տարեկանից բարձր հսկողի թողնել մեքենայում, ինչպես նաև բանալիները թողնել բռնկման կողպեքում։"},
{q:"Ո՞րն է երեխայի համար մեքենայում ամենաանվտանգ տեղը։", o:["Առաջին նստատեղը՝ վարորդին մոտ","Հետևի նստատեղը, և երբեք մի դրեք հետ ուղղված մանկական նստոցը գործող անվտանգության բարձիկի առաջ","Հետևում՝ մեծահասակի գրկին"], c:1, w:"Հետևի նստատեղը երեխաների համար ամենաանվտանգն է, իսկ հետ ուղղված նստոցը չի կարելի դնել գործող անվտանգության բարձիկի առաջ։"},
{q:"Ո՞ւմ կարող են տուգանել, եթե մինչև 16 տարեկան ուղևորները ամրագոտիով ամրացված չեն։", o:["Միայն իրենք՝ ուղևորներին","Ոչ մեկի, եթե վարորդն ամրացված է","Վարորդին"], c:2, w:"Վարորդն է պատասխանատու, որ մինչև 16 տարեկան ուղևորները պատշաճ ամրացված լինեն։"},
{q:"Գիշերը հեռահար լույսը պետք է մարել՝", o:["Հանդիպակաց մեքենայից 500 ֆուտ և ուրիշ մեքենայի հետևից երթևեկելիս 300 ֆուտ հեռավորության վրա","Միայն քաղաք մտնելիս","Ցանկացած մեքենայից 100 ֆուտ հեռավորության վրա"], c:0, w:"Հեռահար լույսը մարեք հանդիպակաց երթևեկությունից 500 ֆուտ և ուրիշ մեքենայի հետևում՝ 300 ֆուտ հեռավորության վրա։"},
{q:"Գիշերը այնքան արագ վարելը, որ չեք կարող կանգնել լուսարձակներով լուսավորված հատվածի ներսում, կոչվում է՝", o:["Գիշերային արագացում","«Անցնել» սեփական լուսարձակներից","Լույսային վազանց"], c:1, w:"Երբեք մի «անցեք» ձեր լուսարձակներից. արագությունը պետք է թույլ տա կանգնել լուսավորված հատվածի ներսում։"},

{q:"Ի՞նչ պետք է անեք, եթե վթարի մեջ կան տուժածներ։", o:["Կանգնել, օգնել տուժածներին և փոխանակվել տվյալներով. վթարի վայրից հեռանալը հանցագործություն է","Արագ հեռանալ և հետո զանգել ապահովագրական ընկերություն","Կանգնել միայն եթե վնասը թանկ է թվում"], c:0, w:"Տուժածներով վթարի վայրից հեռանալը հանցագործություն է. պետք է կանգնել, օգնել տուժածներին և տալ ձեր տվյալները։"},
{q:"Դուք հարվածել եք դատարկ կայանված մեքենայի և չեք կարողանում գտնել սեփականատիրոջը։ Ի՞նչ անել։", o:["Հեռանալ, քանի որ ոչ ոք չտեսավ","Թողնել կարճ ներողություն առանց ձեր անվան","Թողնել գրություն ձեր տվյալներով և վթարի մասին հայտնել ոստիկանությանը"], c:2, w:"Եթե սեփականատիրոջը գտնել չի հաջողվում, թողեք գրություն ձեր անունով և տվյալներով և տեղեկացրեք ոստիկանությանը։"},
{q:"Առանց տուժածների փոքր վթարից հետո ի՞նչ անել մեքենաների հետ, եթե հնարավոր է։", o:["Թողնել դրանք հենց այնտեղ, որտեղ կանգնել են, լուսանկարների համար","Հեռացնել դրանք երթևեկելի մասից, որ երթևեկությունը չարգելափակվի","Կայանել դրանք ամենամոտ հեծանվային գոտում"], c:1, w:"Երբ ոչ ոք չի տուժել, հնարավորության դեպքում հեռացրեք մեքենաները ճանապարհից, որ չարգելափակեն երթևեկությունը։"},
{q:"Ի՞նչ կարող է սպառնալ մեքենայից աղբ, այդ թվում ծխախոտի մնացորդ, նետելու համար։", o:["Տուգանք մինչև $1000","Միայն բանավոր նախազգուշացում առաջին երեք անգամը","Ոչինչ, եթե աղբը փոքր է"], c:0, w:"Մեքենայից աղբ նետելը կարող է բերել տուգանքի մինչև $1000, իսկ կենդանուն ճանապարհի վրա նետելը առանձին խախտում է։"},
{q:"Ի՞նչ է թույլ տալիս C դասի իրավունքը, և ի՞նչ է պետք մոտոցիկլի համար։", o:["C դասը ներառում է նաև մոտոցիկլները","Սովորական մեքենաների համար պետք է առանձին M2","C դասը սովորական մարդատար մեքենաների համար է. մոտոցիկլի համար պետք է առանձին M1 կատեգորիա"], c:2, w:"C դասի իրավունքը սովորական մարդատար մեքենաների համար է, իսկ մոտոցիկլների համար պահանջվում է առանձին M1 կատեգորիա։"},
{q:"Ի՞նչ պետք է ավարտի անչափահասը Կալիֆոռնիայում վարորդական իրավունք ստանալուց առաջ։", o:["Միայն տեսողության ստուգում","Վարելու ուսուցում և 50 ժամ պրակտիկա, դրանցից 10-ը գիշերը, 25 տարեկանից բարձր իրավունք ունեցող մեծահասակի հետ","Մեկ ժամանոց առցանց թեստ"], c:1, w:"Դեռահասներին 15 ու կես տարեկանում ուսուցման թույլտվության համար պետք է վարելու ուսուցում և 50 ժամ պրակտիկա, դրանցից 10-ը գիշերը, 25 տարեկանից բարձր մեծահասակի հսկողությամբ։"},
{q:"Ժամանակավոր իրավունքի առաջին 12 ամիսներին մինչև 18 տարեկան վարորդը չի կարող՝", o:["Վարել 23:00-ից 5:00-ն և տեղափոխել 20 տարեկանից փոքր ուղևորներ առանց 25 տարեկանից բարձր իրավունք ունեցող ուղեկցողի","Վարել մայրուղիներով ոչ մի ժամանակ","Վարել տասը տարուց հին մեքենա"], c:0, w:"Մինչև 18 տարեկան ժամանակավոր իրավունքով վարորդները առաջին տարում չեն կարող վարել 23:00-ից 5:00-ն և տեղափոխել 20 տարեկանից փոքր ուղևորներ առանց 25 տարեկանից բարձր ուղեկցողի։"},
{q:"Որքա՞ն շուտ պետք է DMV-ին տեղեկացնեք նոր հասցե տեղափոխվելուց հետո։", o:["30 օրվա ընթացքում","90 օրվա ընթացքում","10 օրվա ընթացքում"], c:2, w:"Հասցեի փոփոխության մասին DMV-ին պետք է հայտնել 10 օրվա ընթացքում։"},
{q:"Մեքենան վաճառելուց հետո որքա՞ն շուտ պետք է տեղեկացնեք DMV-ին։", o:["30 օրվա ընթացքում","5 օրվա ընթացքում. գնորդը պետք է սեփականության անցումը ձևակերպի 10 օրվա ընթացքում","DMV-ին տեղեկացնել պետք չէ"], c:1, w:"Վաճառողը պետք է DMV-ին տեղեկացնի 5 օրվա ընթացքում՝ պատասխանատվությունից ազատվելու համար, իսկ գնորդը՝ անցման մասին հայտնի 10 օրվա ընթացքում։"},
{q:"Որո՞նք են Կալիֆոռնիայի համարանիշների կանոնները։", o:["Համարանիշները պարտադիր են առջևից և հետևից, գործող գրանցման պիտակը՝ հետևի համարանիշի վրա","Պահանջվում է միայն մեկ հետևի համարանիշ","Պիտակը կպցվում է առջևի համարանիշի վրա"], c:0, w:"Կալիֆոռնիայում համարանիշները պարտադիր են և առջևից, և հետևից, իսկ գործող գրանցման պիտակը կպցվում է հետևի համարանիշին։"},
{q:"Որքա՞ն հաճախ են մեքենաների մեծ մասին Կալիֆոռնիայում պետք արտանետումների թունավորության ստուգում (smog check)։", o:["Յուրաքանչյուր վեց ամիսը մեկ","Միայն մեքենան վաճառելիս","Սովորաբար երկու տարին մեկ"], c:2, w:"Մեքենաների մեծ մասը պետք է անցնի արտանետումների ստուգում, սովորաբար երկու տարին մեկ։"},
{q:"Ի՞նչ կարող է լինել առանց ապահովագրության կամ կասեցված իրավունքով վարելու դեպքում։", o:["Ոչինչ, եթե զգույշ վարեք","Մեքենան կարող են տարհանել տուգանային հրապարակ, իսկ վարորդին՝ պատժել","Միայն փոքր տուգանք ուշացման համար"], c:1, w:"Առանց ապահովագրության կամ կասեցված իրավունքով վարելը կարող է բերել պատիժների և մեքենայի տարհանման տուգանային հրապարակ։"},
{q:"Ե՞րբ կարող եք DMV-ի միջոցով գրանցվել որպես օրգանների դոնոր։", o:["Վարորդական իրավունքի դիմելիս կամ այն երկարացնելիս","Միայն հիվանդանոցում 30 տարեկանից հետո","Երբեք. DMV-ն դրանով չի զբաղվում"], c:0, w:"Օրգանների դոնոր կարող եք գրանցվել վարորդական իրավունքի դիմելիս։"},
{q:"Որտե՞ղ պետք է պահվի ֆինանսական պատասխանատվության ապացույցը, օրինակ ապահովագրությունը։", o:["Միայն տանը՝ ապահով տեղում","Միայն ապահովագրական ընկերության գրասենյակում","Մեքենայի մեջ՝ ոստիկանին և վթարի մասնակիցներին ցույց տալու համար"], c:2, w:"Ապահովագրության ապացույցը պետք է պահել մեքենայում և ներկայացնել իրավապահներին և վթարի մյուս մասնակիցներին։"},
{q:"Ի՞նչ է նշանակում Կալիֆոռնիայում 100 մղոն/ժ-ից բարձր արագությունը։", o:["Թույլատրվում է դատարկ գյուղական մայրուղիներում","Ծանր խախտում է՝ բարձրացված տուգանքներով և իրավունքի հնարավոր կասեցմամբ","Հավասարվում է սովորական փոքր տուգանքի արագության համար"], c:1, w:"100 մղոն/ժ-ից բարձր արագությունը լուրջ խախտում է՝ բարձրացված տուգանքներով և իրավունքի հնարավոր կասեցմամբ։"},
{q:"Կարելի՞ է անցնել ճանապարհի վրա ընկած հրշեջ խողովակի վրայով։", o:["Ոչ, առանց հրշեջների թույլտվության չի կարելի","Այո, եթե շատ դանդաղ վարեք","Այո, եթե մոտակայքում հրշեջ մեքենա չկա"], c:0, w:"Ճանապարհի վրա գտնվող հրշեջ խողովակի վրայով անցնել չի կարելի առանց հրշեջների թույլտվության։"},
{q:"Ի՞նչ է պահանջվում Կալիֆոռնիայում մոտորային սկուտերով երթևեկելու համար։", o:["Իրավունք պետք չէ ոչ մի տարիքում","Պետք է լինեք 21 տարեկանից բարձր՝ մոտոցիկլի իրավունքով","Պետք է լինեք առնվազն 16 տարեկան՝ իրավունքով կամ ուսուցման թույլտվությամբ, և երթևեկության կանոնները գործում են ամբողջությամբ"], c:2, w:"Մոտորային սկուտերով կարելի է երթևեկել 16 տարեկանից՝ գործող իրավունքով կամ թույլտվությամբ, և երթևեկության բոլոր կանոնները կիրառվում են լիովին։"},
{q:"Ի՞նչ կարող է պահանջվել DUI-ի համար կասեցումից հետո իրավունքը վերականգնելու համար։", o:["Նամակ գործատուից","Ապահովագրության հաստատում SR-22 ձևով","Նոր մեքենայի գնում"], c:1, w:"DUI-ի համար կասեցումից հետո իրավունքը վերականգնելու համար կարող է պահանջվել ապահովագրության հաստատում SR-22 ձևով։"},

<script>
const QB = { en: QB_EN.concat(QB_EN_A,QB_EN_B,QB_EN_C,QB_EN_D,QB_EN_E), ru: QB_RU.concat(QB_RU_A,QB_RU_B,QB_RU_C,QB_RU_D,QB_RU_E), hy: QB_HY.concat(QB_HY_A,QB_HY_B,QB_HY_C,QB_HY_D,QB_HY_E) };
const PASS_MARK = 30;
const SESSION_N = 36;
let lang = "hy";
let mode = "practice";
let order = [];
let idx = 0;
let answers = [];
let revealed = [];
let lastResult = null;

function S(){ return STRINGS[lang]; }
function bank(){ return QB[lang]; }
function show(id){
  ["screen-home","screen-paywall","screen-quiz","screen-result"].forEach(function(x){
    document.getElementById(x).style.display = (x===id) ? "block" : "none";
  });
}
function applyStrings(){
  var s = S();
  document.querySelectorAll(".langs button").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-lang")===lang);
  });
  document.getElementById("t-title").textContent = s.title;
  document.getElementById("t-sub").textContent = s.sub;
  document.getElementById("t-practice").textContent = s.practice;
  document.getElementById("t-practice-d").textContent = s.practiceD;
  document.getElementById("t-exam").textContent = s.exam;
  document.getElementById("t-exam-d").textContent = s.examD;
  document.getElementById("t-note").textContent = s.note;
  document.getElementById("t-footer").innerHTML = s.footer;
  document.getElementById("btn-again").textContent = s.again;
  document.getElementById("btn-home").textContent = s.home;
  document.getElementById("btn-share").textContent = s.share;
  document.getElementById("btn-next").textContent = (order.length && idx >= order.length-1) ? s.finish : s.next;
  document.getElementById("t-prem-badge").textContent = s.premBadge;
  document.getElementById("p-title").textContent = s.payTitle;
  document.getElementById("p-sub").textContent = s.paySub;
  document.getElementById("p-f1").textContent = s.payF1;
  document.getElementById("p-f2").textContent = s.payF2;
  document.getElementById("p-f3").textContent = s.payF3;
  document.getElementById("p-price").textContent = s.payPrice;
  document.getElementById("p-price-note").textContent = s.payPriceNote;
  document.getElementById("btn-buy").textContent = s.payBuy;
  document.getElementById("btn-pay-home").textContent = s.home;
  document.getElementById("p-restore-note").textContent = s.payRestore;
  if(window.__premium){ var po = document.getElementById("p-owned"); po.textContent = s.payOwned; po.className = "owned show"; }
}
function setLang(l){
  lang = l;
  applyStrings();
  if(document.getElementById("screen-quiz").style.display === "block") renderQuestion();
  if(document.getElementById("screen-result").style.display === "block" && lastResult) renderResult();
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function startQuiz(m){
  mode = m;
  var n = Math.min(SESSION_N, bank().length);
  order = shuffle(Array.from({length:bank().length}, function(_,i){ return i; })).slice(0, n);
  idx = 0;
  answers = new Array(n).fill(null);
  revealed = new Array(n).fill(false);
  lastResult = null;
  show("screen-quiz");
  renderQuestion();
}
function renderQuestion(){
  var s = S(), b = bank(), qi = order[idx], item = b[qi];
  document.getElementById("q-count").textContent = s.qOf(idx+1, order.length);
  document.getElementById("q-mode").textContent = (mode==="practice") ? s.modePractice : s.modeExam;
  document.getElementById("q-bar").style.width = ((idx)/order.length*100) + "%";
  document.getElementById("q-text").textContent = item.q;
  var box = document.getElementById("q-opts");
  box.innerHTML = "";
  item.o.forEach(function(text, i){
    var btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = text;
    if(answers[idx] === i) btn.classList.add("selected");
    if(mode==="practice" && revealed[idx]){
      btn.disabled = true;
      if(i === item.c) btn.classList.add("correct");
      else if(answers[idx] === i) btn.classList.add("wrong");
    }
    btn.onclick = function(){ pickOption(i); };
    box.appendChild(btn);
  });
  var why = document.getElementById("q-why");
  if(mode==="practice" && revealed[idx]){
    var ok = answers[idx] === item.c;
    why.className = "why show " + (ok ? "ok" : "bad");
    document.getElementById("q-verdict").textContent = ok ? s.correct : s.wrong;
    document.getElementById("q-why-text").textContent = item.w;
  } else {
    why.className = "why";
  }
  var next = document.getElementById("btn-next");
  next.textContent = (idx >= order.length-1) ? s.finish : s.next;
  next.disabled = (mode==="practice") ? !revealed[idx] : (answers[idx] === null);
}
function pickOption(i){
  if(mode==="practice" && revealed[idx]) return;
  answers[idx] = i;
  if(mode==="practice") revealed[idx] = true;
  renderQuestion();
}
function nextQuestion(){
  if(idx < order.length-1){ idx++; renderQuestion(); window.scrollTo(0,0); }
  else {
    stopTimer();
    var b = bank(), score = 0;
    for(var k=0;k<order.length;k++){ if(answers[k] === b[order[k]].c) score++; }
    lastResult = { score: score, total: order.length };
    show("screen-result");
    renderResult();
    window.scrollTo(0,0);
  }
}
function renderResult(){
  var s = S(), b = bank(), r = lastResult;
  document.getElementById("r-score").textContent = r.score + " / " + r.total;
  var st = document.getElementById("r-status");
  if(mode === "exam"){
    var pass = r.score >= PASS_MARK;
    st.textContent = pass ? s.passed : s.failed;
    st.className = "result-status " + (pass ? "pass" : "fail");
  } else {
    st.textContent = "";
    st.className = "result-status";
  }
  document.getElementById("r-note").textContent = s.scoreNote(r.score, r.total);
  renderTopics();
  var rev = document.getElementById("r-review");
  rev.innerHTML = "";
  var missed = [];
  for(var k=0;k<order.length;k++){ if(answers[k] !== b[order[k]].c) missed.push(k); }
  if(missed.length === 0){
    rev.innerHTML = "<h3>" + s.reviewTitle + "</h3><p>" + s.noMistakes + "</p>";
    return;
  }
  function itemHtml(k){
    var item = b[order[k]];
    var yours = (answers[k] === null) ? "—" : item.o[answers[k]];
    return "<div class='review-item'><div class='rq'>" + item.q + "</div>"
      + "<div class='ra'>" + s.yourAnswer + yours + "</div>"
      + "<div class='rc'>" + s.correctAnswer + item.o[item.c] + "</div>"
      + "<div>" + item.w + "</div></div>";
  }
  var h = "<h3>" + s.reviewTitle + " (" + missed.length + ")</h3>";
  if(mode === "exam"){
    var groups = {}, gorder = [];
    missed.forEach(function(k){
      var t = topicOf(order[k]);
      if(!groups[t]){ groups[t] = []; gorder.push(t); }
      groups[t].push(k);
    });
    gorder.forEach(function(t){
      h += "<h4>" + s.topics[t] + " (" + groups[t].length + ")</h4>";
      groups[t].forEach(function(k){ h += itemHtml(k); });
    });
  } else {
    missed.forEach(function(k){ h += itemHtml(k); });
  }
  rev.innerHTML = h;
}
function restart(){ if(mode === "exam"){ startPremiumExam(); } else { startQuiz(mode); } window.scrollTo(0,0); }
function goHome(){ stopTimer(); show("screen-home"); window.scrollTo(0,0); }
function shareResult(){
  var s = S(), r = lastResult; if(!r) return;
  var url = "https://t.me/dmvtestca_bot";
  var text = s.shareText(r.score, r.total);
  var link = "https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(text);
  var tg = window.Telegram && window.Telegram.WebApp;
  if(tg && tg.openTelegramLink){ tg.openTelegramLink(link); }
  else if(navigator.share){ navigator.share({ text: text, url: url }).catch(function(){}); }
  else { window.open(link, "_blank"); }
}
applyStrings();
</script>

<script>
/* ===== DMV Premium (Telegram Stars) — premium v1, build 2026-11-12 =====
   Free practice stays untouched. The exam simulation is Premium:
   45-minute timer, mistake review grouped by topic, per-topic stats.
   Payment: the app asks the dmv-bot-backend for a Stars invoice link,
   pays via Telegram.WebApp.openInvoice, and the backend activates an
   unlock key only when Telegram reports successful_payment for the
   claim that was embedded in the invoice payload. The key is stored
   in localStorage; the buyer also receives a restore link from the
   bot (?unlock=<key>) for other devices.
   API_BASE: public HTTPS base of dmv-bot-backend. Empty string means
   "not wired yet" — the paywall then honestly reports that payment is
   unavailable (fail-safe). A ?api=https://host query parameter
   overrides it (used for testing). */
var API_BASE = "";
var EXAM_SECONDS = 45 * 60;
var PRICE_STARS = 99;
window.__premium = false;
var __timerId = null;
var __timerLeft = 0;

function apiBase(){
  try{
    var q = new URLSearchParams(location.search).get("api");
    if(q) return q.replace(/\/+$/, "");
  }catch(e){}
  return API_BASE;
}
function topicOf(qi){
  function classify(q){
    function has(){
      for(var i=0;i<arguments.length;i++){ if(q.indexOf(arguments[i]) >= 0) return true; }
      return false;
    }
    if(has("alcohol", "blood alcohol", "under the influence", "dui", "drug", "marijuana", "cannabis")) return "alcohol";
    if(has("sign", "signal", "flashing", "traffic light", "red light", "green light", "arrow", "marking", "center line", "yellow line", "white line", "diamond", "crossbuck", "lane ends")) return "signs";
    if(has("speed", "mph", "miles per hour")) return "speed";
    if(has("park", "curb")) return "parking";
    if(has("yield", "right-of-way", "right of way", "pedestrian", "crosswalk", "school", "blind intersection", "emergency vehicle", "funeral")) return "rightofway";
    if(has("bicycle", "bicyclist", "cyclist", "motorcycle", "truck", "blind spot", "following distance", "tailgat", " bus", "train", "trolley", "share the road")) return "sharing";
    if(has("u-turn", "passing", "pass on", "pass a", "left-turn", "center left-turn", "turn left", "turn right", "backed up", "flow of traffic", "breaks down", "breakdown", "freeway exit")) return "maneuvers";
    if(has("seat belt", "seatbelt", "child", "airbag", "headlight", "fog", "rain", "wet", "slippery", "skid", "hydroplan", "brake", "tire", "distract", "cell phone", "texting", "drowsy", "fatigue", "mirror", "steering", "wiper")) return "safety";
    if(has("license", "insurance", "registration", "collision", "fine", "suspend", "revok", "points", "dmv", "permit", "illegal", "against the law")) return "laws";
    return null;
  }
  var qOnly = QB.en[qi].q.toLowerCase();
  return classify(qOnly) || classify(qOnly + " " + QB.en[qi].w.toLowerCase()) || "other";
}
function fmtTime(sec){
  var m = Math.floor(sec/60), s2 = sec % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s2 < 10 ? "0" : "") + s2;
}
function startTimer(){
  stopTimer();
  __timerLeft = EXAM_SECONDS;
  var el = document.getElementById("q-timer");
  el.style.display = "inline";
  el.classList.remove("low");
  el.textContent = "\u23F1 " + fmtTime(__timerLeft);
  __timerId = setInterval(function(){
    __timerLeft--;
    if(__timerLeft <= 0){
      el.textContent = "\u23F1 00:00";
      stopTimer();
      finishExamTimedOut();
      return;
    }
    if(__timerLeft <= 60) el.classList.add("low");
    el.textContent = "\u23F1 " + fmtTime(__timerLeft);
  }, 1000);
}
function stopTimer(){
  if(__timerId){ clearInterval(__timerId); __timerId = null; }
  var el = document.getElementById("q-timer");
  if(el) el.style.display = "none";
}
function finishExamTimedOut(){
  var tg = window.Telegram && window.Telegram.WebApp;
  if(tg && tg.showAlert){ try{ tg.showAlert(S().timeUp); }catch(e){} }
  var b = bank(), score = 0;
  for(var k=0;k<order.length;k++){ if(answers[k] === b[order[k]].c) score++; }
  lastResult = { score: score, total: order.length };
  show("screen-result");
  renderResult();
  window.scrollTo(0,0);
}
function renderTopics(){
  var box = document.getElementById("r-topics");
  box.innerHTML = "";
  if(mode !== "exam" || !lastResult) return;
  var s = S(), b = bank();
  var stats = {}, torder = [];
  for(var k=0;k<order.length;k++){
    var t = topicOf(order[k]);
    if(!stats[t]){ stats[t] = { ok: 0, total: 0 }; torder.push(t); }
    stats[t].total++;
    if(answers[k] === b[order[k]].c) stats[t].ok++;
  }
  torder.sort(function(a, c){
    var ra = stats[a].ok / stats[a].total, rc = stats[c].ok / stats[c].total;
    if(ra !== rc) return ra - rc;
    return stats[c].total - stats[a].total;
  });
  var h = "<h3>" + s.topicsTitle + "</h3>";
  torder.forEach(function(t){
    var st = stats[t], pct = Math.round(st.ok / st.total * 100);
    var weak = (st.ok / st.total) < 0.8 && st.total >= 2;
    h += "<div class='topic-row" + (weak ? " weak" : "") + "'><div class='tr-head'><span>"
      + s.topics[t] + (weak ? " \u00B7 <span class='weak-tag'>" + s.weakTag + "</span>" : "")
      + "</span><span>" + st.ok + " / " + st.total + "</span></div>"
      + "<div class='bar'><i style='width:" + pct + "%'></i></div></div>";
  });
  box.innerHTML = h;
}
function openExam(){
  if(window.__premium){ startPremiumExam(); }
  else { show("screen-paywall"); window.scrollTo(0,0); }
}
function startPremiumExam(){
  startQuiz("exam");
  startTimer();
}
function payError(msg){
  var e = document.getElementById("p-err");
  e.textContent = msg;
  e.className = "pay-err show";
}
function clearPayError(){
  var e = document.getElementById("p-err");
  e.textContent = "";
  e.className = "pay-err";
}
function payInfo(msg){
  var e = document.getElementById("p-info");
  e.textContent = msg || "";
  e.className = msg ? "pay-info show" : "pay-info";
}
function setPremium(on){
  window.__premium = !!on;
  var po = document.getElementById("p-owned");
  if(on){ po.textContent = S().payOwned; po.className = "owned show"; }
  else { po.className = "owned"; }
}
function apiPost(path, body){
  return fetch(apiBase() + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return { status: r.status, body: j }; });
  });
}
function validateKey(key){
  if(!key) return;
  if(!apiBase()){ setPremium(true); return; }
  apiPost("/api/entitlement", { key: key }).then(function(res){
    if(res.body && res.body.premium){ setPremium(true); }
    else if(res.body && res.body.error === "payments_unavailable"){ setPremium(true); }
    else { try{ localStorage.removeItem("dmv_premium_key"); }catch(e){} setPremium(false); }
  }).catch(function(){ setPremium(true); });
}
function buyPremium(){
  clearPayError();
  payInfo("");
  var s = S();
  var tg = window.Telegram && window.Telegram.WebApp;
  if(!apiBase() || !tg || !tg.openInvoice){ payError(s.payErrUnavailable); return; }
  var btn = document.getElementById("btn-buy");
  btn.disabled = true;
  apiPost("/api/invoice", { initData: tg.initData || "" }).then(function(res){
    if(res.status !== 200 || !res.body || !res.body.url){ throw new Error("invoice"); }
    var claim = res.body.claim;
    tg.openInvoice(res.body.url, function(status){
      if(status === "paid"){
        payInfo(s.payPending);
        pollClaim(claim, 0, btn);
      } else {
        btn.disabled = false;
        if(status !== "cancelled" && status !== "pending") payError(s.payErrGeneric);
      }
    });
  }).catch(function(){
    btn.disabled = false;
    payError(s.payErrUnavailable);
  });
}
function pollClaim(claim, n, btn){
  if(n > 24){ btn.disabled = false; payInfo(""); payError(S().payErrGeneric); return; }
  setTimeout(function(){
    apiPost("/api/claim", { claim: claim }).then(function(res){
      if(res.body && res.body.status === "paid" && res.body.key){
        try{ localStorage.setItem("dmv_premium_key", res.body.key); }catch(e){}
        payInfo("");
        setPremium(true);
        btn.disabled = false;
        startPremiumExam();
      } else {
        pollClaim(claim, n + 1, btn);
      }
    }).catch(function(){ pollClaim(claim, n + 1, btn); });
  }, 1500);
}
(function initPremium(){
  var key = null;
  try{
    var u = new URLSearchParams(location.search);
    var unlock = u.get("unlock");
    if(unlock){ key = unlock; localStorage.setItem("dmv_premium_key", key); }
    var tg = window.Telegram && window.Telegram.WebApp;
    if(!key && tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param){
      var sp = tg.initDataUnsafe.start_param;
      if(sp.indexOf("unlock_") === 0){ key = sp.slice(7); localStorage.setItem("dmv_premium_key", key); }
    }
    if(!key) key = localStorage.getItem("dmv_premium_key");
  }catch(e){}
  if(key) validateKey(key);
})();
</script>

<script>
(function(){var tg=window.Telegram&&window.Telegram.WebApp;function scheme(){var s=null;try{s=new URLSearchParams(window.location.search).get('theme');}catch(e){}if(s!=='dark'&&s!=='light')s=null;if(!s&&tg&&tg.colorScheme)s=tg.colorScheme;if(!s&&window.matchMedia)s=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';return s;}function apply(){var s=scheme();if(s)document.documentElement.setAttribute('data-scheme',s);if(tg){try{if(tg.setHeaderColor)tg.setHeaderColor(s==='dark'?'#131418':'#F3F4F6');if(tg.setBackgroundColor)tg.setBackgroundColor(s==='dark'?'#131418':'#F3F4F6');}catch(e){}}}apply();if(!tg)return;try{tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();if(tg.onEvent)tg.onEvent('themeChanged',apply);}catch(e){}})();
</script>
